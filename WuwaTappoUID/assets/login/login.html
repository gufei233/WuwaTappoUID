<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WuwaTappo 登录</title>
  <style>
    @font-face{font-family:Tappo;src:url('../assets/tappo.woff2') format('woff2');font-display:swap}
    @font-face{font-family:MiSans;src:url('../assets/misans.woff2') format('woff2');font-weight:150 700;font-display:swap}
    :root{color-scheme:light;--bg:#fef3e0;--brown:#8e5e43;--soft:#a88a72;--accent:#c8714a;--cream:#fffaf0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--brown);font:16px/1.6 MiSans,"Microsoft YaHei",sans-serif}
    main{width:min(100% - 36px,460px);margin:56px auto}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:22px;margin-bottom:26px;border-bottom:2px solid #eed7b4}
    .logo{display:block;width:138px;max-width:38%;height:auto}
    h1{margin:0;font:700 30px/1.3 Tappo,MiSans,sans-serif;text-align:right}
    .card{padding:26px;background:var(--cream);border:1px solid #ebd6b9;border-radius:22px}
    #bindingTarget{margin:0 0 18px;font-size:14px;overflow-wrap:anywhere}
    .field{display:flex;align-items:center;min-height:48px;border:1px solid #e5cfb1;border-radius:10px;background:#fffdf7;margin-bottom:16px;overflow:hidden}
    .prefix{padding:0 15px;color:var(--soft);border-right:1px solid #ebd6b9;font-size:15px}
    input{min-width:0;width:100%;height:46px;border:0;outline:0;background:transparent;padding:0 15px;color:var(--brown);font:16px MiSans,sans-serif}
    input::placeholder{color:#b19b86}input:disabled{opacity:.6}.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px #c8714a12}
    button{border:0;cursor:pointer;font:600 15px MiSans,sans-serif}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
    #codeButton{flex-shrink:0;background:transparent;color:var(--accent);padding:0 15px;height:30px;border-left:1px solid #ebd6b9;white-space:nowrap}
    #loginButton{width:100%;height:46px;border-radius:10px;background:var(--accent);color:var(--cream);font-size:16px}
    #loginButton:hover:not(:disabled){background:#b9633d}
    #message{margin:18px 0 0;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
    #message:empty{display:none}#message.error{color:#af4f3c}#message.success{color:#6b8e6a;text-align:center;font:700 28px Tappo,MiSans,sans-serif;margin:8px 0}
    dialog{width:min(100% - 36px,400px);padding:30px;border:1px solid #ebd6b9;border-radius:22px;background:var(--cream);color:var(--brown);text-align:center;font-family:MiSans,sans-serif}
    dialog::backdrop{background:#3d271f66}.success-title{font:700 30px Tappo,MiSans,sans-serif;margin:0 0 18px}
    dialog a{display:block;margin-top:20px;padding:10px;border-radius:10px;background:var(--accent);color:var(--cream);text-decoration:none}
    [hidden]{display:none!important}
    @media(max-width:480px){main{margin-top:32px}.logo{width:116px}h1{font-size:27px}.brand{gap:12px}.card{padding:22px}}
    @media(max-width:360px){main{width:calc(100% - 24px)}h1{font-size:24px}.card{padding:18px}#codeButton{padding:0 11px}}
  </style>
</head>
<body>
<main>
  <header class="brand"><img class="logo" src="../assets/logo.webp" alt="WuwaTappo"><h1>WuwaTappo 登录</h1></header>
  <section class="card">
    <p id="bindingTarget">__WT_BINDING_TARGET__</p>
    <form id="loginForm">
      <div class="field"><span class="prefix">+86</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="手机号" aria-label="手机号" pattern="1[3-9][0-9]{9}" maxlength="11" required disabled></div>
      <div class="field"><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="验证码" aria-label="验证码" pattern="[0-9]{4}" maxlength="4" required disabled><button id="codeButton" type="button" disabled>获取验证码</button></div>
      <button id="loginButton" type="submit" disabled>登录</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>
<dialog id="successModal"><p class="success-title">登录成功</p><p>请返回机器人查看账号绑定结果。</p><p id="redirectCountdown">5秒后跳转到项目主页</p><a href="https://github.com/gufei233/WuwaTappoUID">立即跳转</a></dialog>
<script src="https://static.geetest.com/v4/gt4.js"></script>
<script>
  "use strict";
  const initial = __WT_BOOTSTRAP__;
  const auth = initial.auth, config = initial.sdk_config;
  const loginCommand = initial.login_command;
  const submitUrl = new URL("../login", location.href);
  const form = document.getElementById("loginForm"), phone = document.getElementById("phone"), code = document.getElementById("code");
  const button = document.getElementById("loginButton"), codeButton = document.getElementById("codeButton"), message = document.getElementById("message");
  const deviceNum = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2,"0")).join("");
  let sessionStatus = initial.data.state || "failed", busy = false, resendAt = 0;
  let expiryTimer, resendTimer;
  function show(text, error = false) {message.textContent = text;message.className = error ? "error" : "";}
  function enableInputs(enabled) {phone.disabled = code.disabled = !enabled;codeButton.disabled = !enabled || Date.now() < resendAt;}
  function accepted() {
    sessionStatus = "submitted";clearInterval(expiryTimer);clearInterval(resendTimer);
    form.hidden = true;phone.value = code.value = "";show("");
    document.getElementById("successModal").showModal();
    let remaining = 5;
    const timer = setInterval(() => {
      document.getElementById("redirectCountdown").textContent = --remaining + "秒后跳转到项目主页";
      if (remaining <= 0) {clearInterval(timer);location.href = "https://github.com/gufei233/WuwaTappoUID";}
    },1000);
  }
  function captcha() {
    return new Promise((resolve, reject) => {
      if (typeof initGeetest4 !== "function") {reject(new Error("人机验证加载失败，请刷新重试。"));return;}
      initGeetest4({captchaId:"1dd87176b1565667de6f8add815425ed",language:"zho",riskType:"slide",product:"bind"}, obj => {
        obj.onReady(() => obj.showCaptcha()).onSuccess(() => {
          const data = obj.getValidate();
          resolve({geetestLotNumber:data.lot_number,geetestCaptchaOutput:data.captcha_output,
                   geetestPassToken:data.pass_token,geetestGenTime:data.gen_time});
        }).onError(() => reject(new Error("人机验证失败，请重试。"))).onClose(() => reject(new Error("已取消验证。")));
      });
    });
  }
  // 对照官方 Web SDK 1.x：相同的国服短信接口、公共参数和 OAuth token 交换。
  async function sdk(path, data, allowCaptcha = true) {
    const payload = {redirect_uri:"1",__e__:"1",pack_mark:"1",platform:"h5",channelId:"201",
                     projectId:config.gameId,productId:config.pkgId,deviceNum,version:"1.2.3w",sdkVersion:"1.2.3w",...data};
    let result;
    try {
      const response = await fetch("https://sdkapi.kurogame.com/sdkcom/v2/" + path, {
        method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8",
                               "Kr-Ver":"1.9.0","Accept-Language":config.lang+","+navigator.languages},
        body:new URLSearchParams(payload)
      });
      if (!response.ok) throw new Error();
      result = await response.json();
    } catch (_) {throw new Error("库洛登录服务暂不可用，请稍后重试。");}
    if (result.code === 41000 && allowCaptcha) return sdk(path,{...data,...await captcha()},false);
    if (result.code !== 0) throw new Error(result.msg || "手机号或验证码不正确。");
    return result.data;
  }
  async function submit(login) {
    busy = true;enableInputs(false);button.disabled = true;button.textContent = "登录中…";show("");
    try {
      const response = await fetch(submitUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({auth,login}),cache:"no-store"});
      if (!response.ok) throw new Error(`登录服务请求失败（接口 login，HTTP ${response.status}）。`);
      const result = await response.json();
      if (!result.success) {show(result.msg || "提交失败，请刷新页面重试。",true);return;}
      accepted();
    } catch (error) {show(error.message + "\n请返回机器人查看结果，或刷新本页确认。",true);}
  }
  codeButton.addEventListener("click",async () => {
    if (!phone.reportValidity()) return;
    codeButton.disabled = true;show("");
    try {
      await sdk("login/getPhoneCode.lg",{phone:phone.value});resendAt = Date.now()+60000;code.focus();
      function tick() {
        const seconds = Math.max(0,Math.ceil((resendAt-Date.now())/1000));
        codeButton.textContent = seconds ? seconds+"s" : "获取验证码";
        if (!seconds) {clearInterval(resendTimer);codeButton.disabled = sessionStatus !== "pending" || busy;}
      }
      tick();resendTimer = setInterval(tick,1000);
    } catch (error) {show(error.message,true);codeButton.disabled = sessionStatus !== "pending" || busy;}
  });
  form.addEventListener("submit",async event => {
    event.preventDefault();if (busy) return;
    if (sessionStatus === "verifying") {await submit(null);return;}
    if (sessionStatus !== "pending") return;
    const mobile = phone.value,verification = code.value;
    busy = true;enableInputs(false);button.disabled = true;button.textContent = "登录中…";show("");
    try {
      const ua = navigator.userAgent;
      const os = /Windows NT/.test(ua)?"Windows":/iPhone OS/.test(ua)?"iOS":/Android/.test(ua)?"Android":/Mac OS X/.test(ua)?"macOS":"Linux";
      const deviceModel = /Edg/.test(ua)?"Edge":/Firefox/.test(ua)?"Firefox":/Chrome/.test(ua)?"Chrome":"Safari";
      const account = await sdk("login/phoneCode.lg",{phone:mobile,code:verification,response_type:"code",client_id:config.clientId,deviceModel,os});
      if (!account || !account.code) throw new Error("库洛登录响应不完整，请稍后重试。");
      const access = await sdk("auth/getToken.lg",{code:account.code,client_id:config.clientId,client_secret:config.clientSecret,grant_type:"authorization_code"},false);
      if (!access || !access.access_token || !account.cuid || !account.id || !account.username) throw new Error("库洛登录凭据不完整，请稍后重试。");
      await submit({token:access.access_token,cuid:String(account.cuid),sdk_openid:String(account.id),username:String(account.username),expires_in:Number(access.expires_in)||0});
    } catch (error) {busy = false;enableInputs(true);button.disabled = false;button.textContent = "登录";show(error.message,true);}
  });
  function initialize() {
    if (sessionStatus === "success" || sessionStatus === "processing") {accepted();return;}
    if (sessionStatus === "verifying") {button.disabled = false;button.textContent = "继续登录";show(initial.msg,true);}
    else if (sessionStatus === "pending") {enableInputs(true);button.disabled = false;}
    else {form.hidden = true;show(initial.msg || `链接已失效，请重新发送 ${loginCommand}。`,true);return;}
    expiryTimer = setInterval(() => {
      if (Date.now() >= initial.data.expires_at && !busy) {enableInputs(false);button.disabled = true;show(`链接已过期，请重新发送 ${loginCommand}。`,true);clearInterval(expiryTimer);}
    },1000);
  }
  initialize();
</script>
</body>
</html>
